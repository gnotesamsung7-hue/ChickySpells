<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFC83D">
<title>Chicky School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one centered "school notebook" column; each screen is a page of ruled paper with wooden alphabet blocks. */
:root{
  --paper:#FFFDF5; --rule:#C9DDF3; --margin:#F3A6A6; --ink:#25304A; --soft:#5C6784;
  --blue:#2F6FDE; --sun:#FFC83D; --leaf:#2FAE66; --berry:#E2486A; --wood:#F2C98B; --wood-dk:#C9914A;
  --card:#FFFFFF; --shadow:0 4px 0 rgba(37,48,74,.18);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;
  background-image:linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
  repeating-linear-gradient(180deg,transparent 0 35px,var(--rule) 35px 36px);}
*{box-sizing:border-box}
button{font-family:var(--display);cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;min-height:100%}
.screen{display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(34px,8vw,52px)} h2{font-size:28px} h3{font-size:21px}
p{margin:0;line-height:1.5}
.muted{color:var(--soft)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}

.btn{font-weight:600;font-size:20px;padding:14px 22px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);border:2px solid var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(37,48,74,.18)}
.btn.big{font-size:28px;padding:20px 30px;border-radius:24px}
.btn.go{background:var(--sun)} .btn.blue{background:var(--blue);color:#fff} .btn.green{background:var(--leaf);color:#fff}
.btn.small{font-size:16px;padding:8px 14px;border-radius:12px}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;font-size:16px}
.btn.danger{background:var(--berry);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.owl{width:150px;height:auto;flex:none}
.owl .lid{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.owl.cheer{animation:hop .6s ease 2}
.owl.sad{animation:tilt .7s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}}
.starpill{display:inline-flex;align-items:center;gap:8px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.star{width:22px;height:22px;fill:var(--ink)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sample-tag{display:inline-block;font-size:13px;font-family:var(--display);background:#FFE7A6;border:1.5px dashed var(--wood-dk);border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:middle}

/* Play */
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dot.ok{background:var(--leaf)} .dot.miss{background:var(--berry)} .dot.now{background:var(--sun);transform:scale(1.3)}
.stage{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.stage .owl{width:110px}
.bubble{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:14px 16px;font-size:21px;min-height:64px;line-height:1.35}
.bubble:before{content:"";position:absolute;left:-12px;top:24px;width:20px;height:20px;background:var(--card);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.listen{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:76px;padding:6px 0}
.slot{width:60px;height:68px;border-radius:12px;border:3px dashed var(--soft);display:grid;place-items:center;font-size:42px;font-weight:700;font-family:var(--body);background:rgba(255,255,255,.6)}
.slot.fill{border:2px solid var(--wood-dk);background:var(--wood);box-shadow:inset 0 -6px 0 rgba(0,0,0,.08),var(--shadow);animation:pop .18s ease}
.slot.bad{background:#FFC2CE;border-color:var(--berry)}
.slot.good{background:#B9F0CF;border-color:var(--leaf)}
.slot.hint{color:var(--blue)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.flash{font-size:46px;text-align:center;font-weight:700;letter-spacing:.12em;color:var(--blue);min-height:0}
.mic{width:120px;height:120px;border-radius:50%;background:var(--berry);color:#fff;border:3px solid var(--ink);box-shadow:var(--shadow);display:grid;place-items:center;margin:0 auto;position:relative}
.mic svg{width:54px;height:54px;fill:#fff}
.mic.on{background:var(--leaf)}
.mic.on:after{content:"";position:absolute;inset:-12px;border-radius:50%;border:4px solid var(--leaf);animation:ring 1.1s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.miclabel{text-align:center;font-family:var(--display);font-size:18px;color:var(--soft)}
.heard{text-align:center;font-size:16px;color:var(--soft);min-height:22px}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.key{font-family:var(--body);font-weight:700;font-size:28px;aspect-ratio:1/1;max-height:62px;border-radius:12px;background:var(--wood);border:2px solid var(--wood-dk);box-shadow:0 3px 0 var(--wood-dk);padding:0}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dk)}
.key.used{opacity:.25;pointer-events:none}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.note{font-size:15px;color:var(--soft);text-align:center}
.lvlpill{font-family:var(--display);font-weight:600;font-size:15px;padding:4px 14px;border-radius:999px;border:2px solid var(--ink)}
.lvlpill.lv0{background:#B9F0CF}.lvlpill.lv1{background:#FFE7A6}.lvlpill.lv2{background:#FFC2CE}
.lookword{display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(48px,14vw,76px);font-weight:700;letter-spacing:.14em;color:var(--blue);background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:6px 16px;box-shadow:var(--shadow);transition:opacity .4s}
.lookword.done{opacity:.35}
.pic{font-size:.8em;letter-spacing:0;line-height:1}
.btn.clue{background:#FFE7A6}
.cluebox{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center;font-size:21px;background:#FFF6D6;border:2px dashed var(--wood-dk);border-radius:16px;padding:12px 16px;animation:pop .25s ease}
.cluebox .pic{font-size:56px}
.cluebox b.big{font-size:32px;color:var(--blue)}
.slot.given{background:#FFF6E3;color:var(--soft);border-style:solid;box-shadow:none}
.slot.next{border-color:var(--blue);border-style:solid;background:#EAF1FF;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.wobble{animation:shake .35s}
.key.big{font-size:38px;max-height:84px}
.key.glow{background:var(--sun);border-color:var(--ink);box-shadow:0 0 0 5px rgba(255,200,61,.6);animation:pulse .8s infinite}

/* Done / book */
.bigstars{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.bigstars svg{width:46px;height:46px;fill:var(--sun);stroke:var(--ink);stroke-width:1.5}
.wordchips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--body);font-weight:700;border-radius:999px;padding:4px 12px;border:2px solid var(--ink);background:var(--card)}
.chip.ok{background:#B9F0CF} .chip.miss{background:#FFD9E0}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.sticker{aspect-ratio:1/1;border-radius:18px;border:2px dashed var(--soft);display:grid;place-items:center;font-size:44px;background:rgba(255,255,255,.7)}
.sticker.got{border:2px solid var(--ink);background:var(--card);box-shadow:var(--shadow)}
.sticker.locked{font-family:var(--display);font-size:22px;color:var(--soft)}
.newsticker{font-size:96px;text-align:center;animation:pop .5s ease}
.meter{height:18px;border-radius:999px;border:2px solid var(--ink);background:var(--card);overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun)}

/* Parent */
.parent{font-family:system-ui,"Segoe UI",sans-serif;font-size:16px}
.parent .btn{font-size:16px;padding:9px 14px;border-radius:12px}
label{font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);width:100%}
textarea{min-height:170px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.5}
.lists{display:flex;flex-direction:column;gap:8px}
.listitem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:2px solid var(--rule);border-radius:12px;background:var(--paper)}
.listitem.active{border-color:var(--leaf);background:#ECFAF2}
.listitem .name{flex:1;min-width:140px;font-weight:700}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700}
.pill.m{background:#B9F0CF} .pill.l{background:#FFE7A6} .pill.t{background:#FFC2CE} .pill.n{background:#E6EBF5}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFF0F3;border:2px solid var(--berry);border-radius:10px;padding:8px 10px}
.gatebox{max-width:420px;margin:30px auto 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-family:var(--display);z-index:20}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:10;width:100%;height:100%}
@media (max-width:520px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .homegrid{grid-template-columns:1fr}
  .slot{width:48px;height:58px;font-size:34px}
  .key{font-size:24px}
  .stage .owl{width:80px}
  .bubble{font-size:18px}
  body{background-image:repeating-linear-gradient(180deg,transparent 0 35px,var(--rule) 35px 36px)}
}

/* Home activities, streak, goal, badges */
.streakpill{display:inline-flex;align-items:center;gap:6px;background:#FFE0D2;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-family:var(--display);font-weight:700;font-size:18px}
.home-stage .owl{width:140px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.act,.mode{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--card);border:2px solid var(--ink);border-radius:24px;padding:18px 14px;box-shadow:var(--shadow);font-family:var(--body);min-width:0}
.act:active,.mode:active{transform:translateY(3px)}
.act[disabled]{opacity:.5}
.act-spell{background:#EAF1FF}.act-count{background:#FFF3D1}
.act-art{display:flex;gap:6px}
.act-art i{font-style:normal;font-weight:700;font-size:30px;width:44px;height:48px;display:grid;place-items:center;background:var(--wood);border:2px solid var(--wood-dk);border-radius:10px;box-shadow:0 3px 0 var(--wood-dk)}
.act-art b{font-size:24px;width:42px;height:52px;display:grid;place-items:center;background:#fff;border:2px solid var(--ink);border-radius:50% 50% 46% 46%/58% 58% 42% 42%}
.act-name{font-family:var(--display);font-weight:700;font-size:24px}
.act-sub{color:var(--soft);font-size:16px;line-height:1.3}
.act .btn{pointer-events:none;margin-top:4px}
.goal{display:flex;gap:10px;justify-content:center;font-size:40px}
.goalegg{filter:grayscale(.2);opacity:.75}.goalegg.done{opacity:1;animation:pop .4s ease}
.praise{align-items:center;text-align:center;font-size:20px;background:#F1FBF5;max-width:520px}
.badgewin{flex-direction:row;align-items:center;gap:16px;background:#FFF6D6}
.medal{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:32px;background:#E6EBF5;border:3px dashed var(--soft);font-family:var(--display);color:var(--soft)}
.medal.got{background:var(--sun);border:3px solid var(--ink);color:var(--ink);box-shadow:var(--shadow)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px;border-radius:16px;border:2px dashed var(--rule);background:rgba(255,255,255,.7)}
.badge.got{border:2px solid var(--ink);background:var(--card)}
.badge small{color:var(--soft);font-size:13px;line-height:1.3}
/* Counting */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode.sel{background:#FFF3D1;outline:4px solid var(--sun);outline-offset:2px}
.mode-art{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em}
.chipbtn{font-family:var(--display);font-weight:700;font-size:24px;min-width:84px;padding:10px 18px;border-radius:999px;background:var(--card);border:2px solid var(--ink);box-shadow:var(--shadow)}
.chipbtn.sel{background:var(--sun)}
.cprog{display:block;width:100%;max-width:260px;height:16px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.cprog i{display:block;height:100%;width:0;background:var(--leaf);transition:width .3s}
.eggs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px 10px;padding:4px}
.eggs.small{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;width:100%;max-width:560px}
.eggs.small .egg{height:54px;font-size:16px}
.egg{position:relative;height:80px;display:grid;place-items:center;background:#fff;border:3px solid var(--rule);border-radius:50% 50% 46% 46%/58% 58% 42% 42%;font-family:var(--display);font-weight:700;font-size:26px;color:var(--soft);font-variant-numeric:tabular-nums}
.egg>span{display:flex;flex-direction:column;align-items:center;line-height:1}
.egg.given{border-color:var(--ink);color:var(--ink);background:#FFFBEF}
.egg.chicky{border-color:var(--blue);color:var(--blue);background:#EAF1FF}
.egg.done{border-color:var(--leaf);color:var(--ink);background:#E3F8EC}
.egg.now{border-color:var(--sun);background:#FFF6D6;color:var(--ink);box-shadow:0 0 0 5px rgba(255,200,61,.45);animation:pulse 1.2s infinite}
.egg .chick{font-size:22px;margin-bottom:2px}
.egg .ghost{opacity:.4;color:var(--blue)}
.egg .hop{position:absolute;top:-12px;left:-10px;font-style:normal;font-size:13px;background:var(--blue);color:#fff;border-radius:999px;padding:2px 7px}
.egg.hatch{animation:hatch .6s ease}
@keyframes hatch{0%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.1)}50%{transform:rotate(10deg) scale(1.1)}100%{transform:rotate(0)}}
.choices{display:flex;flex-direction:column;gap:6px}
.numbtn{font-family:var(--display);font-weight:700;font-size:32px;min-width:84px;height:72px;border-radius:18px;background:var(--wood);border:2px solid var(--wood-dk);box-shadow:0 4px 0 var(--wood-dk)}
.numbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dk)}
@media (max-width:620px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;text-align:left;align-items:center;flex-wrap:wrap}.mode .act-sub{flex-basis:100%}}
@media (max-width:520px){.acts{grid-template-columns:1fr 1fr;gap:10px}.act{padding:14px 8px}.act-name{font-size:20px}.act-art i{width:34px;height:40px;font-size:24px}.act-art b{width:32px;height:42px;font-size:18px}.home-stage .owl{width:96px}.home-stage h1{font-size:30px}}

/* Levels + level check */
.levelrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lvchip{font-family:var(--display);font-weight:600;font-size:15px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:5px 12px}
.gradepick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gradepick .act-name{font-size:28px}
.wordopts{display:flex;flex-direction:column;gap:12px;max-width:420px;width:100%;margin:0 auto}
.wordopt{font-family:var(--body);font-weight:700;font-size:40px;letter-spacing:.06em;padding:12px;border-radius:18px;background:var(--card);border:3px solid var(--ink);box-shadow:var(--shadow)}
.wordopt:active{transform:translateY(3px)}
.right{background:#B9F0CF!important;border-color:var(--leaf)!important}
.wrongpick{background:#FFD9E0!important;border-color:var(--berry)!important}
.eggs.placement{grid-template-columns:repeat(4,1fr);max-width:420px;margin:0 auto;width:100%}
.lvrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.lvrow>span{font-weight:700;min-width:80px;text-align:left}
.lvrow .chipbtn{font-size:16px;min-width:0;padding:8px 12px}
.lgroup{display:flex;flex-direction:column;gap:8px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.lesson{position:relative;text-align:left;font-family:var(--display);font-weight:600;font-size:17px;padding:12px 14px;border-radius:14px;background:var(--paper);border:2px solid var(--rule)}
.lesson.sel{background:#FFF3D1;border-color:var(--ink);box-shadow:var(--shadow)}
.lesson .tick{font-style:normal;color:var(--leaf);margin-left:6px;font-weight:700}
.lesson .rec{display:block;font-style:normal;font-size:12px;color:#fff;background:var(--blue);border-radius:999px;padding:1px 8px;width:max-content;margin-top:4px}
.egg.wide{font-size:20px}
.act-art b.w{width:52px;font-size:17px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="app" id="app"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></symbol>
</svg>
<script>
(function(){
"use strict";
const app=document.getElementById('app');
const KEY='hootspell.v1';
const STICKERS=['🦄','🐙','🦖','🚀','🌈','🐳','🦊','🍩','🐝','🦋','🐢','🎈','🐧','🦁','🍉','🐸','🚂','🦜','🍦','🐼','🎸','🌻','👑','🐞'];
const STARS_PER_STICKER=10;

const NAMES={a:['a','ay','eh','hey','hay'],b:['b','be','bee','bea'],c:['c','see','sea','si','cee','she'],d:['d','dee','de','the'],e:['e','ee','he'],f:['f','eff','ef','if'],g:['g','gee','ji','jee','gi'],h:['h','aitch','age','haitch','ach','eich'],i:['i','eye','aye','hi'],j:['j','jay','jae','jey'],k:['k','kay','cay','okay','ok','que'],l:['l','el','elle','ell','al'],m:['m','em','um','im'],n:['n','en','in','an'],o:['o','oh','owe','ooh'],p:['p','pee','pea','pe'],q:['q','queue','cue','kew','kyu'],r:['r','are','ar','our','or'],s:['s','es','ess','yes','ass'],t:['t','tee','tea','ti','te'],u:['u','you','yu','ewe','yoo'],v:['v','vee','vi','ve'],w:['w'],x:['x','ex','ax'],y:['y','why','wy','wai'],z:['z','zee','zed','zeee']};
const LOOK={};for(const L in NAMES)for(const n of NAMES[L])if(!(n in LOOK))LOOK[n]=L;
const FILLER=new Set(['letter','letters','capital','small','uh','umm','hmm','and','then','next','is','its',"it's",'spell','spelled','spells','um']);
function parseLetters(raw,target){
  const toks=String(raw).toLowerCase().replace(/[^a-z' ]+/g,' ').split(/\s+/).filter(Boolean);
  const out=[];
  for(let i=0;i<toks.length;i++){
    let t=toks[i];
    if(t==='double'&&toks[i+1]){const nx=toks[i+1];if(nx==='you'||nx==='u'||nx==='yu'){out.push('w');i++;continue}const L=nx.length===1?nx:LOOK[nx];if(L){out.push(L,L);i++;continue}}
    if(t==='dub'||t==='dubya'||t==='doubleyou'||t==='doubleu'){out.push('w');continue}
    if(FILLER.has(t)&&!(t==='um'&&target&&target.includes('m')))continue;
    if(t.length===1){out.push(t);continue}
    if(t in LOOK){out.push(LOOK[t]);continue}
    out.push(...t.replace(/[^a-z]/g,'').split('')); // recognizer merged the letters into a word
  }
  return out.join('');
}

// "two four six", "246810", "three hundred twenty", "one thousand" -> numbers. `upcoming` helps split digits glued together.
function parseNums(raw,upcoming){
  const toks=String(raw).toLowerCase().replace(/(\d),(\d{3})/g,'$1$2').replace(/-/g,' ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
  const out=[];let hund=false;
  const add=(v,i)=>{if(hund&&out.length&&v<100&&toks[i+1]!=='hundred'){out[out.length-1]+=v}else out.push(v);hund=false};
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    if(/^\d+$/.test(t)){
      let s=t,k=out.length,parts=[];
      while(s.length&&upcoming&&k<upcoming.length&&s.startsWith(String(upcoming[k]))){parts.push(upcoming[k]);s=s.slice(String(upcoming[k]).length);k++}
      if(!s.length&&parts.length)out.push(...parts);else out.push(parseInt(t,10));
      hund=false;continue;
    }
    if(t==='and'&&hund)continue;
    if(t in TENS){let v=TENS[t];const nx=toks[i+1];if(nx&&nx in NUMW&&NUMW[nx]>0&&NUMW[nx]<10&&toks[i+2]!=='hundred'){v+=NUMW[nx];i++}else if(nx&&/^[1-9]$/.test(nx)){v+=+nx;i++}add(v,i);continue}
    if(t==='hundred'){if(out.length&&out[out.length-1]>0&&out[out.length-1]<10&&!hund)out[out.length-1]*=100;else out.push(100);hund=true;continue}
    if(t==='thousand'){if(out.length&&out[out.length-1]>0&&out[out.length-1]<10)out[out.length-1]*=1000;else out.push(1000);hund=false;continue}
    if(t in NUMW){add(NUMW[t],i);continue}
    hund=false;
  }
  return out;
}

function makeSeq(L){

const PL_COUNT=[
 {g:0,show:[2,4,6],a:8},{g:0,show:[10,20,30],a:40},{g:0,show:[4,6,8],a:10},
 {g:1,show:[5,10,15],a:20},{g:1,show:[12,14,16],a:18},{g:1,show:[30,40,50],a:60},{g:1,show:[20,25,30],a:35},
 {g:2,show:[100,200,300],a:400},{g:2,show:[23,33,43],a:53},{g:2,show:[20,18,16],a:14},{g:2,show:[35,40,45],a:50},{g:2,show:[70,60,50],a:40}];
let P=null;
function placementIntro(){
  stopListen();VH=null;
  app.innerHTML=`<section class="screen">
   <div class="stage home-stage">${owl('cheer')}<div class="screen" style="gap:10px;min-width:0"><h1>Hello${S.kid&&S.kid!=='Buddy'?', '+esc(S.kid):''}!</h1><div class="bubble" id="bubble">I'm Chicky, your school helper! What grade are you in?</div></div></div>
   <div class="gradepick">${[0,1,2].map(g=>`<button class="act" data-g="${g}"><span class="act-name">${gradeName(g)}</span></button>`).join('')}<button class="act" data-g="-1"><span class="act-name">I'm not sure</span><span class="act-sub">Chicky will guess!</span></button></div>
   ${S.placed?'<div class="actions"><button class="btn" id="hm">Back home</button></div>':''}
  </section>`;
  cluck(3);speak("Hello! I'm Chicky, your school helper! What grade are you in?");
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{sfx.tap();const g=+b.dataset.g;placementReady(g)});
  $('#hm')&&($('#hm').onclick=home);
}
function placementReady(g){
  const msg=g<0?'No problem! Let\'s play a quick game, and I\'ll guess the best lessons for you.':`${gradeName(g)}, wow! Let's play a quick game so I can pick the best lessons for you.`;
  app.innerHTML=`<section class="screen" style="align-items:center;text-align:center">
   ${owl('cheer')}<div class="bubble" id="bubble" style="max-width:520px">${esc(msg)}</div>
   <p class="muted">8 quick questions: 4 spelling and 4 counting. It's okay to guess!</p>
   <div class="actions"><button class="btn go big" id="go">Let's play!</button><button class="btn ghost" id="skip">Skip the game</button></div></section>`;
  speak(msg);
  $('#go').onclick=()=>startPlacement(g<0?1:g,g);
  $('#skip').onclick=()=>{const gg=g<0?1:g;finishPlacement(gg,gg)};
}
function startPlacement(g,chosen){P={d:{spell:g,count:g},asked:new Set(),log:[],i:0,total:8,chosen};nextPlacement()}
function nextPlacement(){
  if(P.i>=P.total)return placementResult();
  const subj=P.i%2===0?'spell':'count',d=P.d[subj],bank=subj==='spell'?PL_SPELL:PL_COUNT;
  const fresh=bank.filter(q=>q.g===d&&!P.asked.has(q));const q=fresh.length?pick(fresh):pick(bank.filter(q=>q.g===d));
  P.asked.add(q);P.q={subj,q,d,answered:false};renderPlacement();
}
function renderPlacement(){
  const {subj,q}=P.q;
  const top=`<div class="topbar"><button class="btn small" id="quit">Stop</button><div class="dots" aria-hidden="true"><span class="cprog"><i style="width:${P.i/P.total*100}%"></i></span></div><span class="lvlpill lv0">Level check</span></div>`;
  if(subj==='spell'){
    app.innerHTML=`<section class="screen">${top}
     <div class="stage"><div id="owlbox">${owl()}</div><div class="bubble" id="bubble">Which word says “${esc(q.w)}”?</div></div>
     <div class="listen"><button class="btn blue" id="hear">Hear word</button></div>
     <div class="wordopts">${shuffle(q.o).map(w=>`<button class="wordopt" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div></section>`;
    const say=()=>speak(`Which word says ${q.w}? ${q.s} ${q.w}.`);say();$('#hear').onclick=say;
    app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>answerPlacement(b.dataset.w,b));
    VH=null;
  }else{
    const opts=shuffle([...new Set([q.a,q.a+1,q.a-1,q.show[2]+(q.show[2]-q.show[1])*2].filter(x=>x>=0&&x!==q.a))]).slice(0,2).concat([q.a]);
    app.innerHTML=`<section class="screen">${top}
     <div class="stage"><div id="owlbox">${owl()}</div><div class="bubble" id="bubble">What number comes next?</div></div>
     <div class="eggs placement">${q.show.map(n=>`<div class="egg given ${String(n).length>=3?'wide':''}"><span>${n}</span></div>`).join('')}<div class="egg now"><span>?</span></div></div>
     ${micOK?`<button class="mic" id="mic" aria-label="Tap and say the number"><svg><use href="#i-mic"/></svg></button><div class="miclabel" id="miclabel">Tap me and say the number</div><div class="heard" id="heard"></div>`:''}
     <div class="choices"><p class="note">${micOK?'Or tap the number:':'Tap the number:'}</p><div class="row" style="justify-content:center">${shuffle(opts).map(n=>`<button class="numbtn" data-n="${n}">${n}</button>`).join('')}</div></div></section>`;
    VH={result:(alts,fin)=>{const h=$('#heard');h&&(h.textContent=`I heard: "${String(alts[0]).trim()}"`);if(!fin)return;let n=null;for(const a of alts){const v=parseNums(a,[q.a]).find(x=>!q.show.includes(x));if(v===q.a){n=v;break}if(n==null&&v!=null)n=v}if(n!=null)answerPlacement(n);else setBubble('Say the next number, or tap it!')},
      noSpeech:()=>setBubble('Say the next number, or tap it!'),idle:'Tap me and say the number',listening:'I\'m listening…'};
    $('#mic')&&($('#mic').onclick=toggleListen);
    speak(`What comes next? ${q.show.join(', ')}…`,null,()=>{if(micOK&&P&&P.q.q===q&&!P.q.answered)startListen()});
    app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{stopListen();answerPlacement(+b.dataset.n,b)});
  }
  $('#quit').onclick=()=>{hush();stopListen();P=null;S.placed?home():placementIntro()};
}
function answerPlacement(val,btn){
  if(!P||P.q.answered)return;P.q.answered=true;stopListen();
  const {subj,q,d}=P.q,right=subj==='spell'?q.w:q.a,ok=val===right;
  P.log.push({subj,g:d,ok});P.d[subj]=ok?Math.min(2,d+1):Math.max(0,d-1);
  app.querySelectorAll('[data-w],[data-n]').forEach(b=>{const v=b.dataset.w??+b.dataset.n;if(v===right)b.classList.add('right');else if(b===btn)b.classList.add('wrongpick')});
  const msg=ok?pick(['Yes! Great job!','Correct! You\'re smart!','You got it!','Egg-cellent!']):`Good try! The answer is ${right}.`;
  setBubble(msg);owlMood(ok?'cheer':'sad');ok?(cluck(2),tone([660,880],0.08,'sine',0.15)):tone([440,392],0.12,'triangle',0.12);
  speak(msg,null,()=>{P.i++;setTimeout(nextPlacement,300)});
}
function estimate(subj){
  const L=P.log.filter(x=>x.subj===subj);let est=0;
  for(const g of [0,1,2]){const at=L.filter(x=>x.g===g),ok=at.filter(x=>x.ok).length;if(ok&&ok>=at.length-ok)est=g}
  return est;
}
function placementResult(){
  VH=null;const sp=estimate('spell'),ct=estimate('count');P.res={spell:sp,count:ct};
  const draw=()=>{
    const r=P.res;
    app.innerHTML=`<section class="screen" style="align-items:center;text-align:center">
     ${owl('cheer')}<h1>All done!</h1>
     <div class="bubble" id="bubble" style="max-width:560px">I think you're a <b>${gradeName(r.spell)} speller</b> and a <b>${gradeName(r.count)} counter</b>! I picked lessons just for you.</div>
     <div class="card" style="width:100%;max-width:560px"><h3>Not quite right? Change it here</h3>
      <div class="lvrow"><span>Spelling</span>${[0,1,2].map(g=>`<button class="chipbtn ${g===r.spell?'sel':''}" data-s="${g}">${gradeName(g)}</button>`).join('')}</div>
      <div class="lvrow"><span>Counting</span>${[0,1,2].map(g=>`<button class="chipbtn ${g===r.count?'sel':''}" data-c="${g}">${gradeName(g)}</button>`).join('')}</div>
      <p class="muted" style="font-size:14px">Chicky keeps watching how it goes and moves the level up or down by itself.</p></div>
     <div class="actions"><button class="btn go big" id="ok">Let's start!</button></div></section>`;
    app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{P.res.spell=+b.dataset.s;sfx.tap();draw()});
    app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{P.res.count=+b.dataset.c;sfx.tap();draw()});
    $('#ok').onclick=()=>finishPlacement(P.res.spell,P.res.count);
  };
  draw();sfx.win();confetti(120);
  speak(`Bok bok! All done! I think you're a ${gradeName(sp)} speller and a ${gradeName(ct)} counter! I picked lessons just for you.`);
}
function finishPlacement(sp,ct){
  hush();setSpellGrade(sp);S.grade.count=ct;S.count.lesson=null;S.placed=true;S.spellHist=[];save();P=null;home();
}

/* ---------- STICKER BOOK ---------- */
function book(){
  stopListen();
  app.innerHTML=`<section class="screen"><div class="row spread"><button class="btn small" id="hm">Home</button><span class="starpill">${star()} ${S.stars}</span></div>
   <h1>My sticker book</h1><p class="muted">Every ${STARS_PER_STICKER} stars unlocks a new sticker. Tap a sticker!</p>
   <div class="book">${STICKERS.map(s=>S.stickers.includes(s)?`<button class="sticker got" data-s="${s}" aria-label="sticker">${s}</button>`:`<div class="sticker locked">?</div>`).join('')}</div>
   <h2>My badges</h2><p class="muted">Keep practising to earn them all!</p>
   <div class="badges">${BADGES.map(b=>{const g=S.badges.includes(b.id);return`<div class="badge ${g?'got':''}"><span class="medal ${g?'got':''}">${g?b.icon:'?'}</span><b>${esc(b.name)}</b><small>${esc(b.desc)}</small></div>`}).join('')}</div></section>`;
  $('#hm').onclick=home;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sfx.tap();b.animate([{transform:'scale(1)'},{transform:'scale(1.3) rotate(10deg)'},{transform:'scale(1)'}],{duration:400})});
}

/* ---------- PARENT GATE ---------- */
function gate(){
  const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);
  app.innerHTML=`<section class="screen parent"><div class="card gatebox"><h2>For grown-ups</h2><p class="muted">Answer to open the parent area.</p>
   <form id="gf" class="screen" style="gap:12px"><label for="ga">What is ${a} × ${b}?<input id="ga" type="number" inputmode="numeric" autocomplete="off"></label>
   <div class="row"><button class="btn blue" type="submit">Open</button><button class="btn" type="button" id="cancel">Back</button></div><p id="gm" class="muted" aria-live="polite"></p></form></div></section>`;
  $('#cancel').onclick=home;$('#ga').focus();
  $('#gf').onsubmit=e=>{e.preventDefault();if(+$('#ga').value===a*b)parent();else{$('#gm').textContent='Not quite. Try again.';$('#ga').value=''}};
}

/* ---------- PARENT AREA ---------- */
let editing=null,confirmDel=null,confirmReset=false;
function wordsToText(L){return L.words.map(w=>[w.w,w.s||'',w.c||''].join(' | ').replace(/( \| )+$/,'')).join('\n')}
function textToWords(t){const seen=new Set();return t.split('\n').flatMap(l=>l.includes('|')?[l]:l.split(',')).map(l=>l.trim()).filter(Boolean).map(l=>{const [w,s,c]=l.split('|');const o={w:w.trim(),s:(s||'').trim()};if(c&&c.trim())o.c=c.trim();return o}).filter(x=>/[a-z]/i.test(x.w)&&!seen.has(x.w.toLowerCase())&&seen.add(x.w.toLowerCase()))}
function status(s){if(!s||!s.seen)return['n','Not tried'];if(s.first>=3&&s.first/s.seen>=0.8)return['m','Mastered'];if(s.miss>s.first)return['t','Tricky'];return['l','Learning']}
function parent(){
  const L=activeList();
  const listsH=S.lists.map(l=>`<div class="listitem ${l.id===S.active?'active':''}"><span class="name">${esc(l.name)}${l.sample?'<span class="sample-tag">example</span>':''} <span class="muted" style="font-weight:400">· ${l.words.length} words</span></span>
     ${l.id===S.active?'<span class="pill m">Active</span>':`<button class="btn small" data-use="${l.id}">Use this list</button>`}
     <button class="btn small" data-edit="${l.id}">Edit</button>
     ${confirmDel===l.id?`<span class="confirm">Delete this list? <button class="btn small danger" data-delyes="${l.id}">Delete</button><button class="btn small" data-delno>Keep</button></span>`:`<button class="btn small" data-del="${l.id}" ${S.lists.length<2?'disabled':''}>Delete</button>`}</div>`).join('');
  const E=editing?S.lists.find(l=>l.id===editing):null;
  const rows=L?L.words.map(w=>{const s=S.stats[w.w.toLowerCase()];const [c,t]=status(s);return`<tr><td><b>${esc(w.w)}</b></td><td>${s?s.seen:0}</td><td>${s&&s.seen?Math.round(s.first/s.seen*100)+'%':'–'}</td><td>${s&&s.seen?LEVELS[s.lvl??0]:'–'}</td><td>${s?s.miss:0}</td><td><span class="pill ${c}">${t}</span></td></tr>`}).join(''):'';
  app.innerHTML=`<section class="screen parent">
   <div class="row spread"><h2>Parent area</h2><button class="btn go" id="hm">Back to ${esc(S.kid)}'s app</button></div>
   ${E?`<div class="card"><h3>${E.words.length?'Edit list':'New list'}</h3>
     <label for="ln">List name<input id="ln" type="text" value="${esc(E.name)}" placeholder="e.g. Week 5 – Grade 1"></label>
     <label for="lw">Words, one per line. Optional: add a sentence after a |, and a clue (a picture emoji or a hint) after a second |.<textarea id="lw" placeholder="cat | The cat is asleep. | 🐱&#10;dog&#10;jump | I can jump high. | 🦘&#10;they | They are my friends. | starts like the">${esc(wordsToText(E))}</textarea></label>
     <p class="muted" style="font-size:14px">Sentences help with words that sound alike, like "sea" and "see". Common words like cat, sun and tree already get a picture clue.</p>
     <div class="row"><button class="btn green" id="savel">Save list</button><button class="btn" id="hearl">Test the voice</button><button class="btn" id="cancell">Cancel</button></div></div>`:''}
   <div class="card"><div class="row spread"><h3>Word lists</h3><button class="btn blue" id="newl">+ New list</button></div><div class="lists">${listsH}</div></div>
   <div class="card"><h3>Progress: ${L?esc(L.name):''}</h3><p class="muted" style="font-size:14px">Each word starts at "Copy it" (the word is shown), then "Fill the gaps" (some letters given), then "Spell it" (from memory, with clues). A clean try moves a word up a level, and a missed word moves back down. Tricky and new words come first.</p>
     <div class="tablewrap"><table><thead><tr><th>Word</th><th>Practised</th><th>First try</th><th>Level</th><th>Misses</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="6">No words yet.</td></tr>'}</tbody></table></div></div>
   <div class="card"><h3>Skip counting</h3>
     <p>Played ${S.count.runs} time${S.count.runs===1?'':'s'} · highest number: ${S.count.best||'–'} · perfect runs: ${S.count.perfect} · lessons mastered: ${LESSONS.filter(l=>isPerfect(l.id)).length} of ${LESSONS.length}</p>
     <p class="muted" style="font-size:14px">Practice streak: ${streakNow()} day${streakNow()===1?'':'s'} (best ${S.days.best||0}). Today: ${todayCount()} of ${GOAL} practices. Badges: ${S.badges.length} of ${BADGES.length}.</p>
     ${(S.count.log||[]).length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Lesson</th><th>Game</th><th>Mistakes</th></tr></thead><tbody>${S.count.log.slice(-6).reverse().map(r=>`<tr><td>${new Date(r.d).toLocaleDateString()}</td><td>${esc(r.lesson||('By 2s to '+r.max))}</td><td>${MODES[r.mode]?MODES[r.mode].name:''}</td><td>${r.miss}</td></tr>`).join('')}</tbody></table></div>`:''}
   </div>
   <div class="card"><h3>Level and voice</h3>
     <p class="muted" style="font-size:14px">Chicky guesses the level with a quick game, then moves it up after two great rounds or down after two hard ones. You can set it yourself here.</p>
     <div class="homegrid">
      <label for="gs">Spelling level<select id="gs">${[0,1,2].map(g=>`<option value="${g}" ${(S.grade.spell??1)===g?'selected':''}>${gradeName(g)}</option>`).join('')}</select></label>
      <label for="gc">Counting level<select id="gc">${[0,1,2].map(g=>`<option value="${g}" ${(S.grade.count??1)===g?'selected':''}>${gradeName(g)}</option>`).join('')}</select></label>
      <label for="vc">Chicky's voice<select id="vc"><option value="chicky" ${S.voice==='chicky'?'selected':''}>Chicken voice with clucks</option><option value="normal" ${S.voice!=='chicky'?'selected':''}>Normal voice</option></select></label>
     </div>
     <div class="row"><button class="btn" id="relevel">Run the level check again</button><button class="btn" id="hearv">Test the voice</button></div>
   </div>
   <div class="card"><h3>Settings</h3>
     <div class="homegrid">
      <label for="kn">Child's name<input id="kn" type="text" value="${esc(S.kid)}"></label>
      <label for="rs">Words per round<select id="rs">${[5,8,10,15,20].map(n=>`<option ${S.roundSize===n?'selected':''}>${n}</option>`).join('')}</select></label>
      <label for="rt">Voice speed: <span id="rtv">${S.rate.toFixed(1)}</span><input id="rt" type="range" min="0.5" max="1.2" step="0.1" value="${S.rate}"></label>
      <label for="sl">New words start at<select id="sl">${LEVELS.map((n,i)=>`<option value="${i}" ${S.startLevel===i?'selected':''}>${n}</option>`).join('')}</select></label>
      <label style="flex-direction:row;align-items:center;gap:10px" for="sk"><input id="sk" type="checkbox" ${S.simpleKeys?'checked':''} style="width:22px;height:22px"> Big simple letter keys (only the word's letters plus a few extras)</label>
      <label style="flex-direction:row;align-items:center;gap:10px" for="sc"><input id="sc" type="checkbox" ${S.scramble?'checked':''} style="width:22px;height:22px"> Include "mixed-up blocks" puzzles</label>
     </div>
     <p class="muted" style="font-size:14px">Voice typing ${(SR||AB)?'is supported in this browser (it asks for the microphone the first time).':'is not supported in this browser. Chrome or Safari works best.'} Words and progress are saved on this device.</p>
     <div class="row">${confirmReset?`<span class="confirm">Reset all stars, stickers, badges and progress? <button class="btn small danger" id="resyes">Reset</button><button class="btn small" id="resno">Cancel</button></span>`:`<button class="btn" id="reset">Reset stars & progress</button>`}</div>
   </div></section>`;
  $('#hm').onclick=()=>{editing=null;confirmDel=null;confirmReset=false;home()};
  $('#newl').onclick=()=>{const id='l'+Date.now();S.lists.push({id,name:'New list',words:[]});editing=id;save();parent();setTimeout(()=>$('#ln')&&$('#ln').select(),0)};
  app.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{S.active=b.dataset.use;save();parent();toast('List is now active')});
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;parent();window.scrollTo({top:0,behavior:'smooth'})});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{confirmDel=b.dataset.del;parent()});
  app.querySelectorAll('[data-delno]').forEach(b=>b.onclick=()=>{confirmDel=null;parent()});
  app.querySelectorAll('[data-delyes]').forEach(b=>b.onclick=()=>{S.lists=S.lists.filter(l=>l.id!==b.dataset.delyes);if(!S.lists.find(l=>l.id===S.active))S.active=S.lists[0].id;if(editing===b.dataset.delyes)editing=null;confirmDel=null;save();parent()});
  if(E){
    $('#savel').onclick=()=>{const ws=textToWords($('#lw').value);E.name=$('#ln').value.trim()||'My words';E.words=ws;if(E.sample&&ws.length)delete E.sample;if(ws.length&&(activeList().sample||!activeList().words.length))S.active=E.id;editing=null;save();parent();toast(`Saved ${ws.length} word${ws.length===1?'':'s'}`)};
    $('#hearl').onclick=()=>{const ws=textToWords($('#lw').value);speak(ws.length?`${ws[0].w}. ${ws[0].s||''}`:'Add a word first.')};
    $('#cancell').onclick=()=>{if(!E.words.length&&E.name==='New list'&&S.lists.length>1){S.lists=S.lists.filter(l=>l!==E);save()}editing=null;parent()};
  }
  $('#kn').onchange=e=>{S.kid=e.target.value.trim()||'Buddy';save()};
  $('#gs').onchange=e=>{setSpellGrade(+e.target.value);S.spellHist=[];save();toast(`Spelling set to ${gradeName(+e.target.value)}`);parent()};
  $('#gc').onchange=e=>{S.grade.count=+e.target.value;S.count.lesson=null;save();toast(`Counting set to ${gradeName(+e.target.value)}`)};
  $('#vc').onchange=e=>{S.voice=e.target.value;save();cluck(2);speak('Bok bok! Hi, I am Chicky!')};
  $('#hearv').onclick=()=>{cluck(2);speak('Bok bok! Hi, I am Chicky, your school helper!')};
  $('#relevel').onclick=()=>{editing=null;placementIntro()};
  $('#rs').onchange=e=>{S.roundSize=+e.target.value;save()};
  $('#rt').oninput=e=>{S.rate=+e.target.value;$('#rtv').textContent=S.rate.toFixed(1);save()};
  $('#rt').onchange=()=>speak('This is how fast I will talk.');
  $('#sc').onchange=e=>{S.scramble=e.target.checked;save()};
  $('#sl').onchange=e=>{S.startLevel=+e.target.value;save()};
  $('#sk').onchange=e=>{S.simpleKeys=e.target.checked;save()};
  $('#reset')&&($('#reset').onclick=()=>{confirmReset=true;parent()});
  $('#resno')&&($('#resno').onclick=()=>{confirmReset=false;parent()});
  $('#resyes')&&($('#resyes').onclick=()=>{S.stars=0;S.stickers=[];S.stats={};S.badges=[];S.days={date:'',streak:0,today:0,best:0};S.count={runs:0,best:0,perfect:0,mode:'together',lesson:null,done:{}};S.spellHist=[];confirmReset=false;save();parent();toast('Progress reset')});
}

S.placed?home():placementIntro();
})();
</script>
